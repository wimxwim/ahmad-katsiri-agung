  <text x="88" y="244" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.2" fill="#005231">pembelajaran siap pakai.</text>
  <text x="91" y="291" font-family="Inter, Arial, sans-serif" font-size="22" fill="#405249">AI menyusun draft. Guru meninjau dan memutuskan. Siswa belajar dengan arah yang jelas.</text>

