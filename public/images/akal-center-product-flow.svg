<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Alur produk AKAL Center</title>
  <desc id="desc">Infografik alur dokumen menjadi pembelajaran dari unggah, draft AI, tinjauan guru, publikasi, belajar siswa, hingga analitik.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2fcf7"/>
      <stop offset="0.56" stop-color="#f8fdf9"/>
      <stop offset="1" stop-color="#fff9eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eec055"/>
      <stop offset="0.5" stop-color="#ffdf9b"/>
      <stop offset="1" stop-color="#eec055"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#006b3e"/>
      <stop offset="1" stop-color="#005231"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
