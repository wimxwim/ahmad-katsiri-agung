services:
  caddy:
    image: caddy:2-alpine
    container_name: akal-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - akal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akal-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-akal}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset}@postgres:5432/${POSTGRES_DB:-akal_center}
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-akal}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset}
      - PGDATABASE=${POSTGRES_DB:-akal_center}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1500M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - akal

  postgres:
    image: postgres:16-alpine
    container_name: akal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset}
      POSTGRES_DB: ${POSTGRES_DB:-akal_center}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akal} -d ${POSTGRES_DB:-akal_center}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - akal

  redis:
    image: redis:7-alpine
    container_name: akal-redis
    restart: unless-stopped
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 150mb --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - akal

networks:
  akal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
